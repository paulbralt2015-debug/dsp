name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64,   arch: x64 }
          - { name: x86,   arch: Win32 }
    steps:
      - uses: actions/checkout@v4
      - name: Configurer
        run: cmake -S . -B build -A ${{ matrix.arch }}
      - name: Compiler
        run: cmake --build build --config Release --target TwinsPlayer ac3test
      - name: Préparer l'archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/TwinsPlayer.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath TwinsPlayer-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TwinsPlayer-${{ matrix.name }}
          path: TwinsPlayer-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, plugins]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip

  plugins:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64, arch: x64 }
          - { name: x86, arch: Win32 }
    steps:
      - uses: actions/checkout@v4
      - name: SDK foobar2000 (facultatif)
        # Définissez la variable de dépôt FB2K_SDK_URL (Settings > Secrets and variables > Actions > Variables)
        # avec l'adresse de l'archive du SDK téléchargée depuis foobar2000.org ; sinon le composant est ignoré.
        if: ${{ vars.FB2K_SDK_URL != '' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ vars.FB2K_SDK_URL }}" -OutFile sdk.7z
          7z x sdk.7z -osdk -y | Out-Null
          $root = (Get-ChildItem sdk -Directory | Select-Object -First 1)
          if (Test-Path "$($root.FullName)/foobar2000/SDK") { echo "FB2K=$($root.FullName)" >> $env:GITHUB_ENV } else { echo "FB2K=$((Resolve-Path sdk).Path)" >> $env:GITHUB_ENV }
      - name: Configurer
        shell: pwsh
        run: |
          $extra = ""
          if ($env:FB2K) { $extra = "-DFB2K_SDK_DIR=$env:FB2K" }
          cmake -S . -B build -A ${{ matrix.arch }} $extra
      - name: Compiler
        shell: pwsh
        run: |
          cmake --build build --config Release --target in_twins_dolby dsp_twins_dolby enginetest
          if ($env:FB2K) { cmake --build build --config Release --target foo_twins_dolby }
      - name: Archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force winamp, foobar | Out-Null
          Copy-Item build/Release/in_twins_dolby.dll winamp/
          Copy-Item build/Release/dsp_twins_dolby.dll winamp/
          Compress-Archive -Path winamp/* -DestinationPath TwinsWinampPlugins-${{ matrix.name }}.zip
          if (Test-Path build/Release/foo_twins_dolby.dll) {
            Copy-Item build/Release/foo_twins_dolby.dll foobar/
            Compress-Archive -Path foobar/* -DestinationPath foo_twins_dolby-${{ matrix.name }}.zip
          }
      - uses: actions/upload-artifact@v4
        with:
          name: TwinsPlugins-${{ matrix.name }}
          path: |
            TwinsWinampPlugins-${{ matrix.name }}.zip
            foo_twins_dolby-${{ matrix.name }}.zip
          if-no-files-found: warn
